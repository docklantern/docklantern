name: Go POC
on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - '.github/workflows/go-poc.yml'
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -l ./cmd/docklantern/main.go ./internal/poc/*.go
      - run: go test ./...
      - run: go vet ./...
