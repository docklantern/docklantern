name: Beta security audit
on:
  workflow_call:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'deploy/docker-socket-proxy/**'
      - 'build/**'
      - 'deploy/traefik/compose.discovery.yaml'
      - '.github/workflows/security-audit.yaml'
      - '.github/workflows/release.yaml'
      - 'security/**'
      - 'scripts/security-*.sh'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  go-vulnerabilities:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Go vulnerability analysis with the exact pinned release builder
        shell: bash
        run: |
          set -euo pipefail
          # Avoid scanning the historical Go 1.23 module directive's stdlib
          # instead of the Go toolchain that compiles the shipping binary.
          builder="$(sed -n 's/^FROM \(golang:[^ ]*\) AS build$/\1/p' Dockerfile)"
          [[ "$builder" == golang:*@sha256:* ]] || exit 1
          docker run --rm --mount "type=bind,source=$PWD,target=/src" -w /src "$builder" sh -ec '
            go install golang.org/x/vuln/cmd/govulncheck@latest
            "$(go env GOPATH)/bin/govulncheck" ./...
          '

  monitoring-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build exact beta monitoring image (no publish)
        run: docker build --build-arg VERSION=security-audit -t docklantern-audit:ci .
      - name: Scan OS and library vulnerabilities in release image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docklantern-audit:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

  docker-proxy-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the actual patched Docker proxy from deployment Compose
        run: |
          set -euo pipefail
          docker build -f deploy/docker-socket-proxy/Dockerfile -t docklantern-socket-proxy:patched .
      - name: Scan OS and library vulnerabilities in optional Docker socket proxy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: docklantern-socket-proxy:patched
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
