name: Go POC
on:
  pull_request:
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile.poc'
      - 'Dockerfile'
      - 'deploy/docker-socket-proxy/**'
      - 'deploy/traefik/**'
      - 'docs/deployment/**'
      - '.github/workflows/go-poc.yaml'
      - 'tests/integration/**'
      - 'tests/sdk/**'
      - 'scripts/**'
      - 'build/**'
      - '.github/workflows/release.yaml'
      - '.github/workflows/security-audit.yaml'
      - 'docs/security/**'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum
      - run: go test -race ./...
      - run: go vet ./...

  compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - name: Docker availability
        run: |
          docker info
          docker compose version
      - name: Exercise disposable Compose deployments
        env:
          DOCKLANTERN_INTEGRATION_TEST: "1"
        run: bash tests/integration/run-compose.sh

  containerized-compose-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go mod tidy
      - name: Containerized executor using identical host paths
        env:
          DOCKLANTERN_INTEGRATION_TEST: "1"
        run: bash tests/integration/run-containerized.sh

  compose-sdk-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
          cache: false
      - name: Compare CLI and Go SDK project loading
        env:
          DOCKLANTERN_INTEGRATION_TEST: "1"
        run: bash tests/sdk/compare.sh

  packaging-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check packaging and reverse-proxy security on disposable containers
        env:
          DOCKLANTERN_INTEGRATION_TEST: "1"
        run: bash tests/integration/run-packaging.sh

  discovery-proxy-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Exercise restricted Docker API discovery
        env:
          DOCKLANTERN_INTEGRATION_TEST: "1"
        run: bash tests/integration/run-discovery-proxy.sh

  monitoring-flow-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify complete monitoring flow on disposable Compose service
        env:
          DOCKLANTERN_INTEGRATION_TEST: "1"
        run: bash tests/integration/run-monitoring-flow.sh

  beta-release-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved immutable base-image digests
        run: bash scripts/verify-release-inputs.sh

  beta-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Exercise disposable beta installation, backup and restore
        env:
          DOCKLANTERN_INTEGRATION_TEST: "1"
        run: bash tests/integration/run-beta-install.sh


  beta3-zero-touch-onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Confirm label-based enrollment through actual read-only Docker proxy
        env:
          DOCKLANTERN_INTEGRATION_TEST: "1"
        run: bash tests/integration/run-beta3-onboarding.sh

  executor-host-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify nonroot monitor cannot modify executor journal or receipts
        run: bash scripts/test-beta6-executor-boundary.sh

  protected-registration-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify root-owned registration storage on disposable CI runner
        shell: bash
        run: |
          set -euo pipefail
          # No real DockLantern paths, Docker commands, credentials or VPS.
          sudo env -i HOME=/root PATH=/usr/bin:/bin \
            DOCKLANTERN_REGISTRATION_ROOT_FIXTURE=1 \
            "$(command -v go)" test ./internal/executorregistration \
            -run '^(TestProtectedStoreRootFixture|TestPublishProtectedRootFixture|TestTrustedRegistrationInputRootFixture)$' -count=1 -v
          sudo env -i HOME=/root PATH=/usr/bin:/bin \
            DOCKLANTERN_PREVIEW_ROOT_FIXTURE=1 \
            "$(command -v go)" test ./internal/executorpreview \
            -run '^TestProtectedMonitorUIDRootFixture$' -count=1 -v

  protected-journal-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify root-owned executor SQLite journal on disposable CI runner
        shell: bash
        run: |
          set -euo pipefail
          # Only private /root test fixtures; no production journal, Docker
          # writes, Compose sources, secrets or test VPS.
          sudo env -i HOME=/root PATH=/usr/bin:/bin \
            DOCKLANTERN_JOURNAL_ROOT_FIXTURE=1 \
            "$(command -v go)" test ./internal/executorjournal \
            -run '^(TestProtectedJournalRootFixture|TestProtectedJournalCorruptionAndFutureSchemaRootFixture|TestProjectLockRootFixture|TestProjectLockGoroutinesNeverOverlapRootFixture|TestOverrideGenerationStageAndPromotionIntentRootFixture|TestOverrideGenerationCrashBoundariesRemainIncompleteRootFixture|TestOverrideGenerationRejectsUnsafeFilesAndLocksRootFixture|TestReceiptOutboxRootFixture|TestReceiptCrashRestartIdempotencyRootFixture|TestReceiptOutboxRejectsUntrustedFilesystemRootFixture|TestReceiptOutboxQuotaAndUnknownNamesRootFixture|TestReceiptFailsClosedIfJournalChangesBetweenPendingAndPublishedRootFixture|TestWALSnapshotAndQuarantinedRestore|TestBackupCorruptionAndUnsafePaths|TestBackupCrashPointsRemainUntrusted|TestRestoreCrashLeavesOnlyQuarantine|TestMaintenanceLockRootFixture|TestHostStoreHoldsMaintenanceLeaseRootFixture|TestFailedHostOpenReleasesSharedLeaseRootFixture|TestArtifactAuditMatchesNeverAuthorizesRootFixture|TestArtifactAuditDetectsMissingAndTamperedEvidenceRootFixture|TestArtifactAuditPendingReceiptRemainsUnresolvedRootFixture|TestRestoreInverseInventoryMatchesButNeverAuthorizesRootFixture|TestRestoreInverseInventoryRejectsLaterArtifactsRootFixture|TestRestoreInverseInventoryDelegatesMissingReferenceRootFixture)$' -count=1 -v

      - name: Verify trusted Compose source snapshots on disposable root CI fixture
        shell: bash
        run: |
          set -euo pipefail
          sudo env -i HOME=/root PATH=/usr/bin:/bin \
            DOCKLANTERN_JOURNAL_ROOT_FIXTURE=1 \
            "$(command -v go)" test ./internal/executorpreflight \
            -run '^TestTrustedSourceSnapshot' -count=1 -v

  secure-proposal-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Exercise untrusted proposal inbox on disposable root-owned fixture
        shell: bash
        run: |
          set -euo pipefail
          # No real DockLantern paths, Docker writes, credentials, or VPS.
          sudo env -i HOME=/root PATH=/usr/bin:/bin \
            DOCKLANTERN_PROPOSAL_ROOT_FIXTURE=1 \
            "$(command -v go)" test ./internal/executorproposal \
            -run '^(TestReadInboxRootFixture|TestProposalPublicationRootFixture|TestProposalQuotaAndConcurrentPublicationRootFixture|TestProposalUnsafeFilesAndFailClosedRetentionRootFixture|TestProposalTemporaryFilesAreBoundedAndOnlyCleanedWhenOld|TestActualUnprivilegedMonitorPublisherRootFixture)$' -count=1 -v
