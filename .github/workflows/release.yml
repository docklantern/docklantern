name: Versioned release image
on:
  push:
    tags:
      - 'v*.*.*'
permissions:
  contents: read
jobs:
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Require reviewed main commit, semver and pinned base manifests
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main ||
            { echo "Release tag must point to a reviewed main-branch commit" >&2; exit 1; }
          bash scripts/verify-release-inputs.sh
      - name: Validate Go dependency graph, tests and static analysis
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          go test -race ./...
          go vet ./...
      - name: Verify disposable monitoring-only install, backup and recovery
        env:
          DOCKLANTERN_INTEGRATION_TEST: "1"
        run: bash tests/integration/run-beta-install.sh

  release:
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish review-tagged multi-arch image with OCI provenance
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
          tags: ghcr.io/docklantern/docklantern:${{ github.ref_name }}
